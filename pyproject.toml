[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wab11"
version = "0.1.0"
description = "Python library for Weishaupt WAB11 heat pump control via Modbus TCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Julian Kimmig", email = "julian.kimmig@gmx.net" }
]
keywords = ["weishaupt", "wab11", "heat-pump", "modbus", "home-automation", "hvac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "pymodbus>=3.5,<4.0",
    "pydantic>=2.0,<3.0",
    "pandas>=2.3.3",
]

[project.urls]
Repository = "https://github.com/JulianKimmig/wab11/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wab11"]

[dependency-groups]
dev = [
    "wab11[dev]"
]
